name: Pages deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/site/**'
      - 'src/types.ts'
      - 'src/utils/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Státusz generálása
        run: npm run daily -- --ci --no-notify --no-build

      - name: Build
        run: npm run build

      - name: Pages konfigurálása
        uses: actions/configure-pages@v5

      - name: Artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
