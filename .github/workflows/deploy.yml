name: Pages deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'data/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'budapesti-100-big-deal.md'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Státusz generálása
        run: npm run daily -- --ci --no-notify --no-build

      - name: Build
        run: npm run build

      - name: Pages konfigurálása
        uses: actions/configure-pages@v6

      - name: Artifact feltöltése
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 20

      - name: Várakozás a deploy újrapróbálására
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy újrapróbálás
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 20

      - name: Hibaértesítés Discordra
        if: failure() && steps.deployment_retry.outcome != 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"❌ A Big-deal radar Pages deploy hibával állt le. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          else
            echo "Nincs Discord webhook – hibaértesítés kihagyva."
          fi
