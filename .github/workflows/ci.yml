name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'docs/**'
      - '*.md'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: TypeScript ellenőrzés
        run: npm run lint

      - name: Tesztek
        run: npm test

      - name: Titokszivárgás ellenőrzése
        run: npm run check:secrets

      - name: Build
        run: npm run build
