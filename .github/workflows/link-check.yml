name: Link check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-check.yml'
      - 'scripts/check-links.ts'
      - 'src/utils/link-status.ts'

permissions:
  contents: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Forráslinkek ellenőrzése
        run: npm run check:links

      - name: Linkstatus commitolása
        if: always()
        run: |
          git config user.name "big-deal-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/link-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): linkellenőrzés $(date +%F) [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "Nincs commitolható linkstatus."
          fi

      - name: Hibaértesítés Discordra
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ A Big-deal radar heti linkellenőrzése hibát talált. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          else
            echo "Nincs Discord webhook – hibaértesítés kihagyva."
          fi
