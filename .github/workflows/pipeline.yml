name: Napi radar

on:
  schedule:
    # GitHub Actions UTC-ben számol. Budapest: 08:00 / 12:00 / 20:00 (téli idő).
    # Nyáron ezek 09:00 / 13:00 / 21:00 helyi idő szerint futnak.
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: big-deal-radar-daily
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Adatok validálása
        run: npm run validate

      - name: Napi pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          TZ: Europe/Budapest
          LOG_LEVEL: info
        run: npm run daily -- --ci

      - name: Adatváltozás commitolása
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "big-deal-radar-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): napi frissítés $(date +%F) [skip ci]"
            git push
          else
            echo "Nincs adatváltozás – nincs commit."
          fi

      - name: Pages konfigurálása
        uses: actions/configure-pages@v5

      - name: Artifact feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
