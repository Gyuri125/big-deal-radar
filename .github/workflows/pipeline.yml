name: Napi radar

on:
  schedule:
    # GitHub Actions UTC-ben számol. Budapest: 08:00 / 12:00 / 20:00 (téli idő).
    # Nyáron ezek 09:00 / 13:00 / 21:00 helyi idő szerint futnak.
    - cron: '0 7 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Függőségek
        run: npm ci

      - name: Adatok validálása
        run: npm run validate

      - name: Napi pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          TZ: Europe/Budapest
          LOG_LEVEL: info
        run: npm run daily -- --ci

      - name: Adatváltozás commitolása
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "big-deal-radar-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): napi frissítés $(date +%F) [skip ci]"
            git push
          else
            echo "Nincs adatváltozás – nincs commit."
          fi

      - name: Pages konfigurálása
        uses: actions/configure-pages@v6

      - name: Artifact feltöltése
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 20

      - name: Várakozás a deploy újrapróbálására
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy újrapróbálás
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 20

      - name: Hibaértesítés Discordra
        if: failure() && steps.deployment_retry.outcome != 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"content\":\"❌ A Big-deal radar napi futása hibával állt le. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          else
            echo "Nincs Discord webhook – hibaértesítés kihagyva."
          fi
